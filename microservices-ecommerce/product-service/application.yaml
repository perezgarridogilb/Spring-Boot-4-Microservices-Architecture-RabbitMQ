
spring:
  application:
    name: product-service
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: mongodb://root:password@localhost:27017/product-db?authSource=admin
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

